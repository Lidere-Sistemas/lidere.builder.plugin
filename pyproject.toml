[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lidere-builder"
version = "0.3.1"
description = "Lidere Builder: CLI de painel vivo e plugin do Claude Code para construir painéis sobre o ERP pelo portal."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Lidere Sistemas", email = "contato@lideresistemas.com.br" }]
dependencies = [
    "sqlglot==30.22.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "authlib==1.8.0",
    "nodejs-wheel-binaries==24.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[project.scripts]
lidere-painel = "lidere_painel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lidere_painel"]
artifacts = ["src/lidere_painel/estatico/**", "src/lidere_painel/modelo-react/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
